[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agents0to1"
version = "0.1.1"
description = "灵活、可扩展的多智能体框架"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "openai>=1.0.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
# 搜索工具是可选的: 不装也能用框架, 只是 SearchTool 没后端可用
search = [
    "tavily-python",
    "google-search-results",
]
# .env 文件的读取也是可选的 —— 装了 __init__.py 会自动加载, 没装就跳过
dotenv = ["python-dotenv"]
all = [
    "tavily-python",
    "google-search-results",
    "python-dotenv",
]

[tool.setuptools]
# 只打包框架本身
packages = [
    "Agent_0_to_1",
    "Agent_0_to_1.core",
    "Agent_0_to_1.classic_agent",
    "Agent_0_to_1.tools",
    "Agent_0_to_1.tools.builtin",
    "Agent_0_to_1.utils",
]
